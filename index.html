/* V2.2 — gestures and hit targets */
#canvas.selecting{cursor:crosshair}
.marquee-rect{fill:#4055bf16;stroke:#5268ca;stroke-width:1.5;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;pointer-events:none}

#interactionLayer .connect-tip{fill:#fff;stroke:#4055bf;stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none}
#bottom #marqueeTool.active{background:#e5e9ff;color:#4055bf}
@media(hover:none){#nodeLayer .port-hit{cursor:default}}
/* V2.1 — motion: quiet, spatial, interruptible and accessible */
:root{--motion-ease:cubic-bezier(.2,.8,.2,1);--motion-spring:cubic-bezier(.16,1.22,.25,1)}
.chrome{transition:opacity .22s var(--motion-ease),transform .25s var(--motion-ease),box-shadow .23s var(--motion-ease),width .25s var(--motion-ease),max-height .28s var(--motion-ease)}
#topbar{animation:chrome-appear .42s var(--motion-ease) both}
#left{animation:chrome-appear .47s .055s var(--motion-ease) both}
#right{animation:chrome-appear .42s .10s var(--motion-ease) both}
#bottom{animation:bottom-appear .47s .13s var(--motion-spring) both}
#zoom{animation:chrome-appear .44s .19s var(--motion-ease) both}
@keyframes chrome-appear{from{opacity:0;translate:0 8px;filter:blur(2px)}to{opacity:1;translate:0 0;filter:blur(0)}}

.icon-button{transition:background .18s var(--motion-ease),color .18s,transform .23s var(--motion-spring),box-shadow .2s}
.icon-button:active{transform:scale(.85)}

.pill,.mini-action{transition:background .17s,color .17s,transform .2s var(--motion-spring),border-color .17s}
@media(hover:hover){.pill:hover,.mini-action:hover{transform:translateY(-1px)}}
.map-card{transition:background .22s,border-color .22s,transform .24s var(--motion-spring),box-shadow .22s}

@keyframes thumbnail-wake{from{opacity:.55}to{opacity:1}}

#props.collapsed .panel-content{display:block;max-height:0;opacity:0;transform:translateY(-6px);padding-top:0;padding-bottom:0;overflow:hidden;pointer-events:none;visibility:hidden}
#props.collapsed{max-height:44px}
#simulation.collapsed #simContent{display:block;max-height:0;opacity:0;transform:translateY(-6px);padding-top:0;padding-bottom:0;overflow:hidden;pointer-events:none;visibility:hidden}
#simulation{transition:width .24s var(--motion-ease),max-height .24s var(--motion-ease),box-shadow .2s}
#shelf{transition:opacity .23s var(--motion-ease),transform .3s var(--motion-spring),visibility .23s}

#nodeLayer .node-art{transform-box:fill-box;transform-origin:center;transition:filter .17s var(--motion-ease)}

.fx-fly{position:fixed;z-index:20;pointer-events:none;border-radius:12px;background:#eef0ff;color:#4055bf;border:1px solid #b8c1f2;padding:8px 12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 14px 28px #2635641c;will-change:transform,opacity}

function nodeTextLines(t){const out=[];for(const line of String(t||'New idea').split('\n')){let str='';for(const w of line.split(/\s+/)){if((str+' '+w).trim().length>24&&str){out.push(str);str=w}else str=(str+' '+w).trim()}out.push(str||' ')}return out.slice(0,10)}
function dimensions(n){const s=nodeStyle(n),lines=nodeTextLines(n.text);let width=Math.max(90,Math.min(280,Math.max(...lines.map(l=>l.length),7)*s.fontSize*.57+32)),height=Math.max(43,lines.length*(s.fontSize+6)+20);if(s.shape==='circle'){width=height=Math.max(width,height)+15}else if(s.shape==='ellipse'){width+=26;height+=13}return{width,height,lines}}
function boundary(n,target){const p=n,s=nodeStyle(n),d=dimensions(n),dx=target.x-p.x,dy=target.y-p.y,mag=Math.max(.0001,Math.hypot(dx,dy));if(s.shape==='ellipse'||s.shape==='circle'){const alpha=1/Math.sqrt((dx*dx)/(d.width*d.width/4)+(dy*dy)/(d.height*d.height/4));return{x:p.x+dx*alpha,y:p.y+dy*alpha}}const t=Math.min((d.width/2)/Math.max(.0001,Math.abs(dx)),(d.height/2)/Math.max(.0001,Math.abs(dy)));return{x:p.x+dx*t,y:p.y+dy*t}}
function edgePoints(e){const a=pos(e.from),b=pos(e.to);if(!a||!b)return[];const mids=e.bends||[];return[boundary(a,mids[0]||b),...mids,boundary(b,mids[mids.length-1]||a)]}
function screenPos(clientX,clientY){const r=$('canvas').getBoundingClientRect(),v=map().viewport;return{x:(clientX-r.left-v.x)/v.zoom,y:(clientY-r.top-v.y)/v.zoom}}
function worldScreen(x,y){const v=map().viewport;return{x:v.x+x*v.zoom,y:v.y+y*v.zoom}}
function zoom(next,sx=$('stage').clientWidth/2,sy=$('stage').clientHeight/2,animate=true){const v=map().viewport,clamped=Math.max(.2,Math.min(3,next));const old={x:(sx-v.x)/v.zoom,y:(sy-v.y)/v.zoom};const target={zoom:clamped,x:sx-old.x*clamped,y:sy-old.y*clamped};if(animate)animateViewport(target,280);else{stopCamera();Object.assign(v,target);renderCanvas()}changed()}
function fit(mark=true){const visibleNodes=map().nodes.filter(visible);const w=$('stage').clientWidth,h=$('stage').clientHeight,v=map().viewport;if(!visibleNodes.length){v.x=w/2;v.y=h/2;v.zoom=1;renderCanvas();return}let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;for(const n of visibleNodes){const d=dimensions(n);x1=Math.min(x1,n.x-d.width/2);x2=Math.max(x2,n.x+d.width/2);y1=Math.min(y1,n.y-d.height/2);y2=Math.max(y2,n.y+d.height/2)}const leftSpace=$('left').classList.contains('collapsed')?78:215,rightSpace=map().nodes.length>0?55:25,paddingX=leftSpace+rightSpace,paddingY=155;const z=Math.max(.22,Math.min(1.3,(w-paddingX)/Math.max(x2-x1,130),(h-paddingY)/Math.max(y2-y1,100)));const target={zoom:z,x:leftSpace+(w-leftSpace-rightSpace)/2-(x1+x2)/2*z,y:h/2-(y1+y2)/2*z};if(mark){changed();animateViewport(target,430)}else{stopCamera();Object.assign(v,target);renderCanvas()}}
// Catmull–Rom interpolation: path passes THROUGH every bend, with smooth joined tangents.
// Endpoints come from the node boundaries. The JSON still stores only authored bend points.
function curveSegments(pts){
 const tangent=pts.map((p,i)=>{
  const prev=pts[Math.max(0,i-1)],next=pts[Math.min(pts.length-1,i+1)];
  const before=i?Math.hypot(p.x-prev.x,p.y-prev.y):Infinity;
  const after=i<pts.length-1?Math.hypot(next.x-p.x,next.y-p.y):Infinity;
  const dx=(next.x-prev.x)*(i===0||i===pts.length-1?1:.5),dy=(next.y-prev.y)*(i===0||i===pts.length-1?1:.5);
  const magnitude=Math.hypot(dx,dy),limit=.95*Math.min(before,after),scale=magnitude>limit?limit/magnitude:1;
  return{x:dx*scale,y:dy*scale};
 });

}
const atCurve=(s,t)=>{const u=1-t;return{x:u*u*u*s.a.x+3*u*u*t*s.c1.x+3*u*t*t*s.c2.x+t*t*t*s.b.x,y:u*u*u*s.a.y+3*u*u*t*s.c1.y+3*u*t*t*s.c2.y+t*t*t*s.b.y}};
function svgPath(pts){if(!pts.length)return'';const a=pts[0],segments=curveSegments(pts);return 'M'+a.x.toFixed(1)+' '+a.y.toFixed(1)+segments.map(s=>` C${s.c1.x.toFixed(1)} ${s.c1.y.toFixed(1)} ${s.c2.x.toFixed(1)} ${s.c2.y.toFixed(1)} ${s.b.x.toFixed(1)} ${s.b.y.toFixed(1)}`).join('')}

function renderEdges(){let html='';for(const e of map().edges){const points=edgePoints(e);if(!points.length)continue;const s=linkStyle(e),sel=selectedEdge===e.id,hover=hoverEdge===e.id,d=svgPath(points),stroke=sel?(uiTheme==='dark'?'#a5b5ff':'#4055bf'):displayInk(s.stroke);html+=`<g data-edge="${esc(e.id)}"><path d="${d}" fill="none" stroke="${esc(stroke)}" stroke-width="${s.strokeWidth+(sel?.6:0)}" stroke-dasharray="${esc(s.dash||'')}" stroke-linejoin="round" stroke-linecap="round" pointer-events="none"/><path class="hit-edge" data-edge="${esc(e.id)}" d="${d}" fill="none" stroke="transparent" stroke-width="18"/>`;

function renderNodes(){let html='';for(const n of map().nodes){if(n.shelved)continue;const s=nodeStyle(n),d=dimensions(n),sel=selectedNodes.has(n.id),hover=hoverNode===n.id,rx=s.shape==='rounded'?s.radius:s.shape==='rectangle'?s.radius:20;html+=`<g class="node ${connectCandidate===n.id?'connect-target':''}" data-node="${esc(n.id)}" transform="translate(${n.x} ${n.y})"><g class="node-art ${enteringNodes.has(n.id)?'just-added':''}">`;if(sel)html+=`<rect class="node-outline" x="${-d.width/2-5}" y="${-d.height/2-5}" width="${d.width+10}" height="${d.height+10}" rx="${rx+5}" fill="none" stroke="#6475d3" stroke-width="1.2" stroke-dasharray="4 4"/>`;const sh=`fill="${esc(s.fill)}" stroke="${esc(displayInk(s.stroke))}" stroke-width="${s.strokeWidth}"`;if(s.shape==='ellipse'||s.shape==='circle')html+=`<ellipse cx="0" cy="0" rx="${d.width/2}" ry="${d.height/2}" ${sh}/>`;else html+=`<rect x="${-d.width/2}" y="${-d.height/2}" width="${d.width}" height="${d.height}" rx="${rx}" ${sh}/>`;const lineHeight=s.fontSize+6,offset=-(d.lines.length-1)*lineHeight/2+s.fontSize*.33;html+=`<text class="node-label" text-anchor="middle" x="0" y="${offset}" font-size="${s.fontSize}" font-weight="${s.fontWeight}" fill="${esc(displayInk(s.textColor))}">`;d.lines.forEach((line,i)=>html+=`<tspan x="0" dy="${i?lineHeight:0}">${esc(line)}</tspan>`);html+='</text>';if(n.pinned)html+=`<circle cx="${-d.width/2+8}" cy="${-d.height/2+8}" r="3.5" fill="#4055bf" stroke="white" stroke-width="1"/>`;if(sel||hover||gesture?.kind==='connect'&&gesture.from===n.id)html+=`<circle class="port" cx="${d.width/2+9}" cy="0" r="8.2" fill="#fff" stroke="#4055bf" stroke-width="1.8" pointer-events="none"/><circle class="port" cx="${d.width/2+9}" cy="0" r="2.4" fill="#4055bf" pointer-events="none"/><circle class="port-hit" data-port="${esc(n.id)}" cx="${d.width/2+9}" cy="0" r="${Math.max(16,15/map().viewport.zoom)}"/>`;html+='</g></g>'}$('nodeLayer').innerHTML=html;enteringNodes.clear()}
function renderGesture(){
 let html='';
 if(gesture?.kind==='connect'){
  const a=pos(gesture.from),b=connectCandidate?pos(connectCandidate):null;
  if(a){const end=b?boundary(b,a):gesture.current,start=boundary(a,end),d=svgPath([start,end]);html=`<path d="${d}" fill="none" stroke="${b?'#29a18e':'#4055bf'}" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round" vector-effect="non-scaling-stroke" pointer-events="none"/><circle class="connect-tip" cx="${end.x}" cy="${end.y}" r="5"/>`}
 }

  const {start,current}=gesture,x=Math.min(start.x,current.x),y=Math.min(start.y,current.y);
  html=`<rect class="marquee-rect" x="${x}" y="${y}" width="${Math.abs(start.x-current.x)}" height="${Math.abs(start.y-current.y)}" rx="3"/>`;

function connectionTarget(clientX,clientY,source){
 const element=document.elementFromPoint(clientX,clientY);
 if(!element?.closest('#stage'))return null;
 const hit=element.closest('[data-node]')?.dataset.node;
 if(hit&&hit!==source&&pos(hit))return hit;
 const p=screenPos(clientX,clientY),padding=18/map().viewport.zoom;
 let best=null,distance=Infinity;
 for(const n of map().nodes){if(n.shelved||n.id===source)continue;const size=dimensions(n),dx=Math.max(0,Math.abs(n.x-p.x)-size.width/2),dy=Math.max(0,Math.abs(n.y-p.y)-size.height/2),d=Math.hypot(dx,dy);if(d<padding&&d<distance){best=n.id;distance=d}}
 return best;
}
function updateMarquee(g){
 const x1=Math.min(g.start.x,g.current.x),y1=Math.min(g.start.y,g.current.y),x2=Math.max(g.start.x,g.current.x),y2=Math.max(g.start.y,g.current.y);
 selectedNodes=new Set(g.additive?g.baseSelection:[]);
 if(Math.hypot(g.current.x-g.start.x,g.current.y-g.start.y)>4/map().viewport.zoom){
  for(const n of map().nodes){if(n.shelved)continue;const d=dimensions(n);if(n.x+d.width/2>=x1&&n.x-d.width/2<=x2&&n.y+d.height/2>=y1&&n.y-d.height/2<=y2)selectedNodes.add(n.id)}
 }
 selectedEdge=null;
}

document.addEventListener('keydown',ev=>{const k=ev.key.toLowerCase(),mod=ev.ctrlKey||ev.metaKey;if(mod&&k==='s'){ev.preventDefault();doneEditing(true);save(ev.shiftKey);return}if(mod&&k==='o'){ev.preventDefault();pickFile();return}if(mod&&k==='z'){ev.preventDefault();doneEditing(true);if(ev.shiftKey)redo();else undo();return}if(mod&&k==='y'){ev.preventDefault();redo();return}const inField=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);if(inField)return;if(k==='delete'||k==='backspace'){ev.preventDefault();removeSelection()}if(k==='escape'){cancelGesture();clearSelection();focused=false;render()}if(k==='n'){const v=map().viewport,x=($('stage').clientWidth/2-v.x)/v.zoom,y=($('stage').clientHeight/2-v.y)/v.zoom;editNode(addNodeAt(x,y).id)}if(mod&&k==='a'){ev.preventDefault();selectedNodes=new Set(map().nodes.filter(visible).map(n=>n.id));selectedEdge=null;render();return}if(k==='v'){ev.preventDefault();setSelectTool(!selectingTool)}if(k==='p')pinSelected();if(k==='f')fit();if(k===' '){ev.preventDefault();toggleSimulation()}if(ev.shiftKey&&k==='s'){ev.preventDefault();shelveSelected()}});
document.addEventListener('dragover',ev=>{if(ev.dataTransfer?.files?.length)ev.preventDefault()});document.addEventListener('drop',async ev=>{const files=ev.dataTransfer?.files;if(files?.length){ev.preventDefault();if(/\.(mindmap|json)$/i.test(files[0].name))await openFile(files[0])}});
window.addEventListener('beforeunload',ev=>{if(dirty){ev.preventDefault();ev.returnValue=''}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&map().mode==='dynamic')stopSimulation()});window.addEventListener('resize',()=>renderCanvas());
if('launchQueue' in window)window.launchQueue.setConsumer(async launch=>{const handle=launch.files?.[0];if(handle)try{await openFile(await handle.getFile(),handle)}catch(e){notice('File launch failed')}});
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(console.warn);
applyTheme();
if(innerWidth<580){$('left').classList.add('collapsed');$('toggleMaps').innerHTML=ico('chevron-right')}fit(false);if(innerWidth<580&&map().nodes.some(n=>!n.shelved)){const first=map().nodes.find(n=>!n.shelved),v=map().viewport;v.zoom=Math.max(.68,v.zoom);v.x=innerWidth/2-first.x*v.zoom;v.y=innerHeight/2-first.y*v.zoom;}render();
})();
</script>
</body></html>
