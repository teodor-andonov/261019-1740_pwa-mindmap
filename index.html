<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9fafc">
  <meta name="description" content="Mindmap — one graph, many arrangements. A local-first mind mapping canvas.">
  <title>Mindmap</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <style>
    :root { --accent:#4055bf; --accent-soft:#e9ecff; --ink:#222a39; --muted:#7c8799; --border:#e2e6ed; --bg:#f9fafc; --panel:#fff; --surface:#f2f4f8; --shadow:0 12px 40px #26345f10; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); font-size:13px }
    *{box-sizing:border-box} body{margin:0; overflow:hidden; background:var(--bg)} button,input,select,textarea{font:inherit} button{color:inherit;cursor:pointer} button:disabled{opacity:.45; cursor:default} button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .app{display:grid;grid-template-rows:54px 42px minmax(0,1fr) 27px;height:100dvh; min-height:380px}
    header{display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--border);min-width:0;white-space:nowrap}
    .brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:15px;letter-spacing:-.45px;padding-right:14px;border-right:1px solid var(--border)}
    .brand-mark{height:27px;width:27px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff}
    .file-name{border:none;background:transparent;padding:7px 6px;border-radius:6px;font-weight:650;max-width:190px;min-width:70px;text-overflow:ellipsis;outline:none}
    .file-name:hover,.file-name:focus{background:var(--surface)}
    .muted{color:var(--muted)} .dirty{width:7px;height:7px;flex-shrink:0;border-radius:50%;background:#e8a64c;display:none} .dirty.show{display:inline-block}
    .spacer{flex:1}.sep{width:1px;background:var(--border);height:22px;margin:0 5px}
    .btn{border:1px solid transparent;background:transparent;border-radius:8px;padding:8px 10px;font-weight:560;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;min-height:32px}
    .btn:hover{background:var(--surface)} .btn.outlined{border-color:var(--border);background:white}.btn.outlined:hover{background:var(--surface)} .btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:#3346aa}.btn.active{background:var(--accent-soft);color:var(--accent)}
    .btn.small{padding:5px 8px;min-height:27px;font-size:12px}.btn.icon-only{padding:7px;width:32px}
    .btn svg{height:16px;width:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
    .tabs{display:flex;gap:5px;align-items:end;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--border);min-width:0;overflow-x:auto;scrollbar-width:thin}
    .tab{position:relative;align-self:stretch;display:flex;gap:7px;align-items:center;padding:0 15px;border:0;border-bottom:2px solid transparent;background:transparent;white-space:nowrap;color:var(--muted);font-weight:580;max-width:200px}
    .tab .tab-label{overflow:hidden;text-overflow:ellipsis}.tab:hover{background:var(--surface)}.tab.active{border-bottom-color:var(--accent);color:var(--accent);background:#f6f7ff}
    .tab .mode-dot{height:6px;width:6px;border-radius:100%;background:#bdc3ce}.tab .mode-dot.live{background:#29ae85}
    .tabs .tab-action{align-self:center;border:1px solid var(--border);height:26px;min-width:26px;padding:0 8px;border-radius:7px;background:transparent;color:var(--muted);font-size:14px}.tabs .tab-action:hover{color:var(--accent);background:var(--accent-soft)}
    .workspace{display:grid;grid-template-columns:minmax(0,1fr) 278px;min-height:0;position:relative}
    .stage{position:relative;min-width:0;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(#c8cfdd 0.8px,transparent .9px);background-size:24px 24px;touch-action:none}
    .stage[data-theme="sketch"]{background-color:#fcfaf4;background-image:radial-gradient(#d8d0bd 0.7px,transparent .9px)}
    .stage[data-theme="blueprint"]{background-color:#151e32;background-image:radial-gradient(#3b4a68 0.8px,transparent .9px)}
    .stage svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab} .stage svg.panning{cursor:grabbing}
    .stage svg .node-group{cursor:move}.stage svg .edge-hit{cursor:pointer}.stage svg .port{cursor:crosshair}
    .stage svg .node-title{fill:var(--ink);font-size:13px;font-weight:570;pointer-events:none;user-select:none}.stage[data-theme="blueprint"] svg .node-title{fill:#f0f4ff}.stage svg .edge-dot,.stage svg .bend-dot{cursor:move}
    .stage .floating{position:absolute;z-index:2;display:flex;gap:5px;padding:5px;border-radius:10px;background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow)}
    .stage .top-left{top:17px;left:17px}.stage .bottom-left{bottom:15px;left:17px}.stage .bottom-center{bottom:16px;left:50%;transform:translateX(-50%)}
    .help{position:absolute;top:17px;right:18px;max-width:260px;color:var(--muted);font-size:11px;text-align:right;pointer-events:none;line-height:1.6}
    .editor{position:absolute;z-index:5;display:none;width:206px;min-height:66px;background:#fff;border:2px solid var(--accent);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);font-size:13px;color:var(--ink);resize:both;outline:none}
    aside{border-left:1px solid var(--border);background:var(--panel);overflow-y:auto;min-height:0;scrollbar-width:thin}
    .inspector-top{padding:21px 18px 17px;border-bottom:1px solid var(--border)}.eyebrow{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:770}
    .inspector-heading{font-size:19px;letter-spacing:-.5px;font-weight:700;margin:7px 0 3px}.inspector-description{color:var(--muted);font-size:12px;line-height:1.55;margin:0}
    .inspector-group{padding:17px 18px;border-bottom:1px solid var(--border)}.group-title{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:1px;font-weight:750;margin-bottom:13px}
    .field{margin-bottom:14px}.field:last-child{margin-bottom:0}.field label{display:block;margin-bottom:7px;font-size:12px;font-weight:610}.field input[type="text"], .field textarea,.field select{width:100%;background:#fff;border:1px solid var(--border);border-radius:7px;padding:9px 10px;color:var(--ink)}.field textarea{min-height:72px;resize:vertical;line-height:1.4}
    .field input[type="range"]{width:100%;accent-color:var(--accent)}.fieldrow{display:flex;justify-content:space-between;gap:8px;align-items:center}
    .field small{color:var(--muted)}.field .chiprow{display:flex;gap:5px;flex-wrap:wrap}.chip{border:1px solid var(--border);padding:7px 9px;border-radius:7px;background:#fff;font-size:12px}.chip.active{background:var(--accent-soft);color:var(--accent);border-color:#aab7ff}
    .swatches{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.swatch{height:24px;width:24px;border:2px solid white;box-shadow:0 0 0 1px var(--border);border-radius:7px}.swatch.active{box-shadow:0 0 0 2px var(--accent)}
    .callout{background:#f5f7fc;border-radius:9px;padding:12px;font-size:11px;color:#68758a;line-height:1.55}.callout strong{color:var(--ink)}
    .inspector-buttons{display:flex;flex-wrap:wrap;gap:8px}.danger{color:#b5404b!important}
    .footer{background:var(--panel);border-top:1px solid var(--border);padding:0 12px;display:flex;align-items:center;gap:9px;font-size:10px;color:var(--muted)}.footer .bullet{color:#b2bbc9}
    .toast{position:absolute;left:50%;bottom:82px;transform:translateX(-50%);background:var(--ink);color:white;border-radius:9px;padding:10px 14px;box-shadow:var(--shadow);z-index:10;font-size:12px;max-width:80vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
    @media(max-width:1050px){.brand{padding-right:7px}.label-optional{display:none}.file-name{max-width:115px}.workspace{grid-template-columns:minmax(0,1fr) 240px}}
    @media(max-width:720px){.app{grid-template-rows:50px 41px minmax(0,1fr) 24px}.brand{font-size:0;padding-right:5px}.brand-mark{height:26px;width:26px}.file-name{max-width:104px}.btn.primary{padding:7px}.workspace{grid-template-columns:minmax(0,1fr)} aside{position:absolute;top:0;right:0;bottom:0;width:min(82vw,310px);z-index:4;box-shadow:-8px 0 32px #1112;display:none} aside.open{display:block}.help{top:65px;right:12px;max-width:180px}.stage .top-left{top:12px;left:12px}.stage .bottom-left{bottom:12px;left:12px}.btn .label-optional{display:none}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 26 26" width="22" height="22"><path d="M6 7.5L18.5 8.5 13 19 6 7.5" stroke="white" opacity=".8" stroke-width="1.4" fill="none"/><circle cx="6" cy="7.5" r="3.3" fill="white"/><circle cx="18.5" cy="8.5" r="3.3" fill="white"/><circle cx="13" cy="19" r="3.3" fill="white"/></svg></span> Mindmap</div>
    <input id="title" class="file-name" value="Untitled map" aria-label="Map title" title="Rename map">
    <span id="dirty" class="dirty" title="Unsaved changes"></span>
    <div class="spacer"></div>
    <button class="btn" id="newFile" title="New file">New</button>
    <button class="btn" id="openFile" title="Open a local JSON map"><span class="label-optional">Open</span><span aria-hidden="true">↗</span></button>
    <button class="btn outlined" id="saveFile" title="Save to local JSON (Ctrl+S)"><span class="label-optional">Save</span><span aria-hidden="true">↓</span></button>
    <div class="sep"></div>
    <button class="btn primary" id="addNode"><span style="font-size:17px;line-height:12px">+</span> Node</button>
    <button class="btn icon-only" id="toggleInspector" aria-label="Toggle inspector" title="Properties panel"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
  </header>
  <nav class="tabs" id="tabs" aria-label="Map views"></nav>
  <main class="workspace">
    <section class="stage" id="stage" aria-label="Map canvas">
      <div class="floating top-left"><button class="btn small" id="togglePhysics">◌ Relax</button><button class="btn small" id="fitView" title="Fit all nodes">⌗ Fit</button></div>
      <div class="help" id="help">Drag nodes to move · drag a node's small handle to connect<br>Double-click empty space to add a node</div>
      <svg id="canvas" role="img" aria-label="Interactive mind map"><g id="camera"><g id="edgeLayer"></g><g id="nodeLayer"></g><g id="interactionLayer"></g></g></svg>
      <textarea id="inlineEditor" class="editor" aria-label="Edit node text" spellcheck="false"></textarea>
      <div class="floating bottom-left"><button class="btn small" id="zoomOut" title="Zoom out">−</button><button class="btn small" id="zoomValue" title="Reset zoom">100%</button><button class="btn small" id="zoomIn" title="Zoom in">+</button></div>
      <div id="toast" class="toast" role="status"></div>
    </section>
    <aside id="inspector" aria-label="Properties panel"></aside>
  </main>
  <footer class="footer"><span id="counts">0 nodes · 0 links</span><span class="bullet">•</span><span id="status">Local JSON · not yet saved</span><span class="spacer"></span><span>Mindmap v0.1 · No cloud, no account</span></footer>
</div>
<input id="fileInput" type="file" accept=".json,application/json" hidden>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const uid = prefix => prefix + '_' + (globalThis.crypto?.randomUUID?.().slice(0,8) || Math.random().toString(36).slice(2,10));
  const escapeHtml = value => String(value).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const clone = value => JSON.parse(JSON.stringify(value));
  const COLORS = ['#4055bf','#1c9e89','#cb914b','#bd6589','#647a9f','#66788c'];
  const THEMES = {
    minimal: {label:'Minimal', widths:{strong:3.5,medium:2,weak:1}, dashes:{strong:'',medium:'',weak:'5 7'}, dark:false},
    sketch: {label:'Sketchbook', widths:{strong:3,medium:1.8,weak:1.2}, dashes:{strong:'',medium:'',weak:'3 8'}, dark:false},
    blueprint: {label:'Blueprint', widths:{strong:2.5,medium:1.5,weak:1}, dashes:{strong:'',medium:'',weak:'4 5'}, dark:true}
  };
  const defaultPhysics = () => ({length:165,repulsion:2400,gap:20});
  const initialDoc = () => {
    const nodes = [
      {id:'n_ideas',text:'Big idea',shape:'rounded',color:COLORS[0]},
      {id:'n_questions',text:'Questions',shape:'ellipse',color:COLORS[2]},
      {id:'n_research',text:'Research',shape:'rounded',color:COLORS[1]},
      {id:'n_experiments',text:'Experiments',shape:'rounded',color:COLORS[3]},
      {id:'n_decisions',text:'Decisions',shape:'rounded',color:COLORS[0]},
      {id:'n_next',text:'Next steps',shape:'rectangle',color:COLORS[1]}
    ];
    const edges = [
      {id:'e_a',source:'n_ideas',target:'n_questions',strength:'strong'},
      {id:'e_b',source:'n_ideas',target:'n_research',strength:'strong'},
      {id:'e_c',source:'n_questions',target:'n_experiments',strength:'medium'},
      {id:'e_d',source:'n_research',target:'n_decisions',strength:'medium'},
      {id:'e_e',source:'n_experiments',target:'n_decisions',strength:'weak'},
      {id:'e_f',source:'n_decisions',target:'n_next',strength:'strong'}
    ];
    const positions = {n_ideas:{x:-170,y:-10,pinned:false},n_questions:{x:-15,y:-140,pinned:false},n_research:{x:15,y:100,pinned:false},n_experiments:{x:150,y:-115,pinned:false},n_decisions:{x:235,y:85,pinned:false},n_next:{x:415,y:110,pinned:false}};
    return {version:1,id:uid('map'),title:'Untitled map',theme:'minimal',nodes,edges,views:[{id:uid('view'),name:'Exploration 01',mode:'static',positions,routes:{},physics:defaultPhysics(),viewport:{x:0,y:0,zoom:1}}]};
  };
  let doc = initialDoc(), activeViewId = doc.views[0].id, selected = null, hoveredNode = null, hoveredEdge = null;
  let fileHandle = null, dirty = false, gesture = null, velocities = {}, raf = 0, editingId = null, toastTimer = 0;
  const stage = $('stage'), canvas = $('canvas'), camera = $('camera'), edgesEl = $('edgeLayer'), nodesEl = $('nodeLayer'), interactionsEl = $('interactionLayer');
  const view = () => doc.views.find(v => v.id===activeViewId) || doc.views[0];
  const node = id => doc.nodes.find(n => n.id===id);
  const edge = id => doc.edges.find(e => e.id===id);
  const pos = id => view().positions[id];
  const theme = () => THEMES[doc.theme] || THEMES.minimal;
  function notice(message){clearTimeout(toastTimer);const el=$('toast');el.textContent=message;el.classList.add('show');toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
  function markDirty(){dirty=true;$('dirty').classList.add('show');$('status').textContent=fileHandle?'Changes not saved to linked file':'Changes not saved · export JSON to keep them'}
  function markClean(message){dirty=false;$('dirty').classList.remove('show');$('status').textContent=message||(fileHandle?'Saved to local file':'JSON exported · continue editing or save again')}
  function safeNumber(n, fallback=0){return Number.isFinite(Number(n))?Number(n):fallback}
  function ensurePositions(v){
    const fallback=Object.values(v.positions || {}); v.positions=v.positions || {};v.routes=v.routes||{};v.physics={...defaultPhysics(),...(v.physics||{})};v.viewport=v.viewport||{x:0,y:0,zoom:1};
    for(let i=0;i<doc.nodes.length;i++){const n=doc.nodes[i];if(!v.positions[n.id]){const p=fallback[i%Math.max(1,fallback.length)];v.positions[n.id]={x:(p?.x||0)+Math.cos(i*2.4)*130,y:(p?.y||0)+Math.sin(i*2.4)*130,pinned:false};} }
    for(const id in v.positions)if(!node(id))delete v.positions[id];
    for(const id in v.routes)if(!edge(id))delete v.routes[id];
  }
  function validate(raw){
    if(!raw || raw.version!==1 || !Array.isArray(raw.nodes)||!Array.isArray(raw.edges)||!Array.isArray(raw.views)||!raw.views.length)throw Error('Not a compatible Mindmap v1 JSON file');
    const ids=new Set();raw.nodes=raw.nodes.filter(n=>typeof n.id==='string'&&typeof n.text==='string'&&!ids.has(n.id)&&ids.add(n.id));
    const eids=new Set();raw.edges=raw.edges.filter(e=>typeof e.id==='string'&&!eids.has(e.id)&&eids.add(e.id)&&ids.has(e.source)&&ids.has(e.target)&&e.source!==e.target);
    const vs=new Set();raw.views=raw.views.filter(v=>v&&typeof v.id==='string'&&!vs.has(v.id)&&vs.add(v.id)); if(!raw.views.length)throw Error('Map must have at least one view');
    raw.nodes.forEach(n=>{n.shape=['rounded','rectangle','ellipse','circle'].includes(n.shape)?n.shape:'rounded';if(!/^#[0-9a-f]{6}$/i.test(n.color))n.color=COLORS[0]});
    raw.edges.forEach(e=>{if(!['strong','medium','weak'].includes(e.strength))e.strength='medium'});
    raw.views.forEach(v=>{v.mode='static';v.name=String(v.name||'View');v.positions=v.positions&&typeof v.positions==='object'?v.positions:{};v.routes=v.routes&&typeof v.routes==='object'?v.routes:{};v.physics={...defaultPhysics(),...(v.physics||{})};v.viewport={x:safeNumber(v.viewport?.x,0),y:safeNumber(v.viewport?.y,0),zoom:Math.max(.2,Math.min(3,safeNumber(v.viewport?.zoom,1)))};for(const n of raw.nodes){if(!v.positions[n.id])v.positions[n.id]={x:Math.random()*400-200,y:Math.random()*250-125,pinned:false};v.positions[n.id].x=safeNumber(v.positions[n.id].x);v.positions[n.id].y=safeNumber(v.positions[n.id].y);v.positions[n.id].pinned=!!v.positions[n.id].pinned;}for(const k in v.routes){if(!eids.has(k)||!Array.isArray(v.routes[k]))delete v.routes[k];else v.routes[k]=v.routes[k].filter(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)).slice(0,100)} });
    raw.theme=THEMES[raw.theme]?raw.theme:'minimal';raw.title=String(raw.title||'Untitled map');raw.id=String(raw.id||uid('map'));return raw;
  }
  function setDoc(next){stopPhysics();doc=validate(next);activeViewId=doc.views[0].id;fileHandle=null;dirty=false;selected=null;hoveredNode=null;hoveredEdge=null;$('title').value=doc.title;for(const v of doc.views)ensurePositions(v);markClean('Opened JSON · save to write changes');setView(activeViewId,true);}
  function syncStatus(){$('counts').textContent=`${doc.nodes.length} nodes · ${doc.edges.length} links · ${doc.views.length} views`;$('dirty').classList.toggle('show',dirty)}
  const svgRect = () => canvas.getBoundingClientRect();
  function screenToWorld(cx,cy){const rect=svgRect(),v=view().viewport;return {x:(cx-rect.left-v.x)/v.zoom,y:(cy-rect.top-v.y)/v.zoom}}
  function worldToScreen(x,y){const v=view().viewport;return {x:v.x+x*v.zoom,y:v.y+y*v.zoom}}
  function setZoom(next,anchorX=stage.clientWidth/2,anchorY=stage.clientHeight/2){const v=view().viewport;next=Math.max(.2,Math.min(3,next));const worldX=(anchorX-v.x)/v.zoom,worldY=(anchorY-v.y)/v.zoom;v.x=anchorX-worldX*next;v.y=anchorY-worldY*next;v.zoom=next;markDirty();renderCanvas()}
  function fit(){const positions=doc.nodes.map(n=>pos(n.id)).filter(Boolean);const w=stage.clientWidth,h=stage.clientHeight;if(!positions.length||!w||!h)return;let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;for(const p of positions){minX=Math.min(minX,p.x-95);minY=Math.min(minY,p.y-55);maxX=Math.max(maxX,p.x+95);maxY=Math.max(maxY,p.y+55)}const zoom=Math.min(1.35,Math.max(.25,Math.min((w-100)/(maxX-minX),(h-100)/(maxY-minY))));view().viewport={x:w/2-(minX+maxX)/2*zoom,y:h/2-(minY+maxY)/2*zoom,zoom};renderCanvas()}
  function textLines(text){const raw=String(text||'New idea').split('\n');const lines=[];for(const paragraph of raw){let current='';for(const word of paragraph.split(/\s+/)){if((current+' '+word).trim().length>21&&current){lines.push(current);current=word}else current=(current+' '+word).trim()}lines.push(current||' ')}return lines.slice(0,8)}
  function dimensions(n){const lines=textLines(n.text);const charLength=Math.max(7,...lines.map(l=>l.length));let w=Math.max(94,Math.min(224,charLength*7.15+31)),h=Math.max(45,lines.length*18+23);if(n.shape==='circle'){w=h=Math.max(w,h)+20}else if(n.shape==='ellipse'){w+=24;h+=16}return {w,h,lines}}
  function onBoundary(n,p,other){const {w,h}=dimensions(n);const dx=other.x-p.x,dy=other.y-p.y;const ang=Math.atan2(dy,dx);if(n.shape==='circle'||n.shape==='ellipse'){return {x:p.x+Math.cos(ang)*(w/2),y:p.y+Math.sin(ang)*(h/2)}}const t=Math.min((w/2)/Math.max(Math.abs(dx),.0001),(h/2)/Math.max(Math.abs(dy),.0001));return {x:p.x+dx*t,y:p.y+dy*t}}
  function pathPoints(e){const a=node(e.source),b=node(e.target),pa=pos(e.source),pb=pos(e.target);if(!a||!b||!pa||!pb)return[];const mid=(view().routes[e.id]||[]).map(p=>({...p}));const aNext=mid[0]||pb,bPrev=mid[mid.length-1]||pa;return [onBoundary(a,pa,aNext),...mid,onBoundary(b,pb,bPrev)]}

  }
  async function loadFile(file,handle=null){try{const data=JSON.parse(await file.text());setDoc(data);fileHandle=handle;$('status').textContent=handle?'Linked to '+file.name:'Opened '+file.name+' · Save to export changes';notice('Map opened: '+file.name)}catch(err){notice('Could not open file: '+err.message)}}
  async function openFile(){if(window.showOpenFilePicker){try{const [handle]=await window.showOpenFilePicker({types:[{description:'Mindmap JSON',accept:{'application/json':['.json']}}],multiple:false});const file=await handle.getFile();await loadFile(file,handle);return}catch(err){if(err?.name==='AbortError')return;notice('Using standard file picker instead')}}$('fileInput').click()}
  async function saveFile(forceAs=false){if(view().mode==='dynamic'){/* Coordinates are saved as a snapshot; physics continues. */}const serialized=JSON.stringify(doc,null,2)+'\n';
    if(!fileHandle&&window.showSaveFilePicker){try{fileHandle=await window.showSaveFilePicker({suggestedName:(doc.title||'mindmap').replace(/[\\/:*?"<>|]/g,'-')+'.json',types:[{description:'Mindmap JSON',accept:{'application/json':['.json']}}]})}catch(err){if(err?.name==='AbortError')return;notice('File-system saving unavailable; downloading JSON')}}
    if(fileHandle){try{const writable=await fileHandle.createWritable();await writable.write(serialized);await writable.close();markClean();notice('Saved to local JSON file');return}catch(err){fileHandle=null;notice('Cannot write linked file — downloading JSON instead')}}
    const url=URL.createObjectURL(new Blob([serialized],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download=(doc.title||'mindmap').replace(/[\\/:*?"<>|]/g,'-')+'.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);markClean();notice('JSON downloaded — keep it as your source file');}
  function newFile(){if(dirty&&!confirm('Discard unsaved changes and start a new map?'))return;stopPhysics();doc=initialDoc();activeViewId=doc.views[0].id;doc.nodes=[];doc.edges=[];doc.views[0].positions={};fileHandle=null;selected=null;dirty=false;$('title').value=doc.title;markClean('New map · not yet saved');renderUI();notice('New empty map — double-click the canvas to begin')}
  canvas.addEventListener('pointerdown',onPointerDown);canvas.addEventListener('pointermove',onPointerMove);canvas.addEventListener('pointerup',onPointerUp);canvas.addEventListener('pointercancel',cancelGesture);canvas.addEventListener('dblclick',onDblclick);
  canvas.addEventListener('wheel',ev=>{ev.preventDefault();const r=svgRect();setZoom(view().viewport.zoom*Math.exp(-ev.deltaY*.001),ev.clientX-r.left,ev.clientY-r.top)},{passive:false});
  $('tabs').addEventListener('click',ev=>{const tab=ev.target.closest('[data-tab]');if(tab){stopPhysics();setView(tab.dataset.tab)}else if(ev.target.closest('#createView'))duplicateCurrentView(true);else if(ev.target.closest('#duplicateView'))duplicateCurrentView(false)});
  $('tabs').addEventListener('dblclick',ev=>{const tab=ev.target.closest('[data-tab]');if(tab){const target=doc.views.find(v=>v.id===tab.dataset.tab);const name=prompt('Rename view',target.name);if(name?.trim()){target.name=name.trim();markDirty();renderTabs()}}});
  $('inspector').addEventListener('input',updateInspector);$('inspector').addEventListener('change',updateInspector);$('inspector').addEventListener('click',clickInspector);
  $('addNode').onclick=()=>{const v=view().viewport;const n=addNodeAt((stage.clientWidth/2-v.x)/v.zoom,(stage.clientHeight/2-v.y)/v.zoom);editStart(n.id)};
  $('togglePhysics').onclick=togglePhysics;$('fitView').onclick=fit;$('zoomIn').onclick=()=>setZoom(view().viewport.zoom*1.2);$('zoomOut').onclick=()=>setZoom(view().viewport.zoom/1.2);$('zoomValue').onclick=()=>setZoom(1);
  $('toggleInspector').onclick=()=>{$('inspector').classList.toggle('open');$('toggleInspector').classList.toggle('active',$('inspector').classList.contains('open'))};
  $('openFile').onclick=openFile;$('saveFile').onclick=()=>saveFile();$('newFile').onclick=newFile;
  $('fileInput').onchange=async e=>{const file=e.target.files?.[0];if(file)await loadFile(file);e.target.value=''};
  $('title').oninput=event=>{doc.title=event.target.value;markDirty()};
  $('inlineEditor').addEventListener('blur',()=>editingDone(true));$('inlineEditor').addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();editingDone(false)}if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){event.preventDefault();editingDone(true)}});
  document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'){event.preventDefault();editingDone(true);saveFile();return}if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='o'){event.preventDefault();openFile();return}const editing=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);if(editing)return;if(event.key==='Delete'||event.key==='Backspace'){event.preventDefault();removeSelected()}if(event.key==='Escape'){cancelGesture();selected=null;renderUI()}if(event.key===' '&&event.target===document.body){event.preventDefault();togglePhysics()}});
  document.addEventListener('dragover',event=>event.preventDefault());document.addEventListener('drop',async event=>{event.preventDefault();const f=event.dataTransfer?.files?.[0];if(f?.name.endsWith('.json'))await loadFile(f)});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stopPhysics();else if(view().mode==='dynamic')startPhysics()});window.addEventListener('resize',renderCanvas);window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue=''}});
  $('title').value=doc.title;setView(activeViewId,true);if('serviceWorker' in navigator && location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
