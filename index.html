/* V2.2 — gestures and hit targets */
#canvas.selecting{cursor:crosshair}
.marquee-rect{fill:#58585816;stroke:#6a6a6a;stroke-width:1.5;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;pointer-events:none}
#nodeLayer .port-target{pointer-events:none;filter:drop-shadow(0 0 6px #58585855)}

#nodeLayer .node.connect-target .node-art{filter:drop-shadow(0 0 10px #6b6b6b90)}
#interactionLayer .connect-tip{fill:#ffffff;stroke:#585858;stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none}
#bottom #marqueeTool.active{background:#eaeaea;color:#585858}
@media(hover:none){#nodeLayer .port-hit{cursor:default}}
/* V2.1 — motion: quiet, spatial, interruptible and accessible */
:root{--motion-ease:cubic-bezier(.2,.8,.2,1);--motion-spring:cubic-bezier(.16,1.22,.25,1)}

#topbar{animation:chrome-appear .42s var(--motion-ease) both}
#left{animation:chrome-appear .47s .055s var(--motion-ease) both}
#right{animation:chrome-appear .42s .10s var(--motion-ease) both}
#bottom{animation:bottom-appear .47s .13s var(--motion-spring) both}
#zoom{animation:chrome-appear .44s .19s var(--motion-ease) both}

@keyframes bottom-appear{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}
.icon-button{transition:background .18s var(--motion-ease),color .18s,transform .23s var(--motion-spring),box-shadow .2s}
.icon-button:active{transform:scale(.85)}

.pill,.mini-action{transition:background .17s,color .17s,transform .2s var(--motion-spring),border-color .17s}

.map-card{transition:background .22s,border-color .22s,transform .24s var(--motion-spring),box-shadow .22s}

@keyframes thumbnail-wake{from{opacity:.55}to{opacity:1}}
#props .panel-content,#simContent{transition:opacity .2s var(--motion-ease),max-height .28s var(--motion-ease),transform .24s var(--motion-ease),padding .24s;max-height:620px;opacity:1;transform:translateY(0)}
#props.collapsed .panel-content{display:block;max-height:0;opacity:0;transform:translateY(-6px);padding-top:0;padding-bottom:0;overflow:hidden;pointer-events:none;visibility:hidden}
#props.collapsed{max-height:44px}
#simulation.collapsed #simContent{display:block;max-height:0;opacity:0;transform:translateY(-6px);padding-top:0;padding-bottom:0;overflow:hidden;pointer-events:none;visibility:hidden}
#simulation{transition:width .24s var(--motion-ease),max-height .24s var(--motion-ease),box-shadow .2s}
#shelf{transition:opacity .23s var(--motion-ease),transform .3s var(--motion-spring),visibility .23s}
.shelf-item{animation:shelf-item-in .3s var(--motion-spring) both;transition:transform .22s var(--motion-spring),box-shadow .22s}

#nodeLayer .node-art{transform-box:fill-box;transform-origin:center;transition:filter .17s var(--motion-ease)}

@media(prefers-reduced-motion:reduce){.fx-ring,.fx-fly{display:none!important}#nodeLayer .node-art.just-added,#edgeLayer .link-appear{animation:none!important}#simToggle.is-running:after{animation:none!important}}

#propsContent .field>label{width:70px}#propsContent .preset{max-height:43px}#propsContent .panel-section{padding:7px 0}#propsContent .panel-head{margin-bottom:7px}

/* V2.5 — one rail, monochrome chrome, full-app inversion */
:root{--ink:#181818;--muted:#6d6d6d;--accent:#242424;--accent-bg:#eeeeee;--border:#dddddd;--panel:#ffffff;--bg:#f7f7f7;--shadow:0 12px 36px #00000012,0 2px 8px #00000008;color-scheme:light}
html.dark-inverted{filter:invert(1);background:white;color-scheme:light}
#stage{background-color:var(--bg);background-image:radial-gradient(#d2d2d2 .75px,transparent 1px)}
.chrome{background:#fffffff2;border-color:#dedede;box-shadow:var(--shadow)}
.icon-button{color:#565656}.icon-button:hover{background:#eeeeee;color:#121212}.icon-button.active,.pill.active{color:#121212;background:#e9e9e9}
.icon-button.danger:hover,.mini-action.danger:hover{color:#111;background:#e7e7e7}
#unsaved{background:#777}
#left{top:69px;bottom:auto;height:auto;max-height:calc(100dvh - 150px);left:16px;width:226px;padding:7px;display:flex;flex-direction:column;gap:6px;overflow:visible;align-items:stretch;transition:width .22s ease}
#left.collapsed{width:50px}
#railTabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;align-items:center;flex:none}
#railTabs button{width:100%;height:34px;min-width:0;padding:6px 3px;border:0;border-radius:9px;display:grid;place-items:center;background:transparent;color:#666;cursor:pointer;transition:background .15s,color .15s}
#railTabs button:hover{background:#eeeeee;color:#111}
#railTabs button.active{background:#e8e8e8;color:#111}
#railTabs svg{height:18px;width:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#railDeck{display:flex;flex-direction:column;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;max-height:calc(100dvh - 205px)}
.rail-pane{display:none;min-height:0;flex-direction:column;gap:8px;animation:rail-fade .18s ease-out}
.rail-pane.active{display:flex}
@keyframes rail-fade{from{opacity:.45;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
#railDeck .map-list{overflow:visible;max-height:none;min-height:0}
#railDeck .map-card{min-height:82px;border-color:#e7e7e7}
#railDeck .map-card.active{background:#ededed;border-color:#888}
#railDeck .map-card:hover{background:#f1f1f1}
#railDeck .map-thumb{height:70px;background:#fafafa}
#railDeck .map-name{color:#3d3d3d}
#railDeck .rail-header{width:100%;padding:2px 0 5px}
#addMapCollapsed{display:none!important}
#left.collapsed #railTabs{grid-template-columns:1fr}
#left.collapsed #railDeck{display:none}
#left.collapsed #railTabs button{height:37px}
#left.collapsed #railTabs button:last-child svg{transform:rotate(180deg)}
#railStyles #props,#railSimulation #simulation,#railShelf #shelf{position:static;z-index:auto;display:flex;flex-direction:column;align-items:stretch;transform:none!important;transition:none;opacity:1;visibility:visible;pointer-events:auto;max-height:none;max-width:100%;width:100%;min-width:0;min-height:0;background:transparent;border:0;box-shadow:none;padding:0;border-radius:0;overflow:visible}
#railStyles #props .panel-title{display:none}
#railStyles #props.collapsed .panel-content{display:block;max-height:none;opacity:1;visibility:visible;pointer-events:auto;transform:none}
#railStyles #props .panel-content{overflow:visible;max-height:none;padding:1px 2px 8px}
#railStyles #props.hidden{display:flex}
#railStyles .panel-section{padding:6px 0}
#railStyles .preset-list{gap:4px}
#railStyles .preset{padding:5px 2px}
#railStyles .panel-head{letter-spacing:.04em}
#railSimulation #simulation.collapsed #simContent{display:block;max-height:none;opacity:1;visibility:visible;pointer-events:auto;transform:none}
#railSimulation #simContent{display:block;padding:3px 2px}
#railSimulation .panel-title{padding:4px 2px}
#railSimulation #toggleSim{display:none}
#railSimulation .sim-button{color:#333}
#railShelf #shelf .shelf-items{display:flex;flex-direction:column;flex-wrap:nowrap;min-height:58px;max-height:none;overflow:visible;background:#f7f7f7}
#railShelf #shelf .shelf-item{max-width:100%;white-space:normal;text-align:left}
#railShelf #shelf .shelf-header{padding:4px 1px}
#railShelf #closeShelf{display:none}
#right{display:none!important}
#shelfToggle{display:none!important}
#zoom{display:none!important}
#bottom{gap:2px}
#quickbar{background:#ffffffee;border-color:#ddd}
#quickbar .quick-style:hover,#quickbar .quick-style.active{background:#eaeaea;border-color:#777}
#nodeLayer .port-hit{fill:transparent;pointer-events:all;cursor:crosshair}
#nodeLayer .port{filter:drop-shadow(0 1px 2px #00000024)}
#nodeLayer .node.connect-target .node-art{filter:drop-shadow(0 0 5px #55555555)}
#fxLayer .fx-ring{border-color:#77777777}
#fxLayer .fx-fly{background:#eee;color:#222;border-color:#aaa}
#simToggle.is-running:after{border-color:#888}
body.focus-mode #railTabs{pointer-events:none}

@media(max-width:580px){#left{top:59px;left:9px;max-height:calc(100dvh - 127px);width:min(212px,calc(100vw - 18px))}#left.collapsed{width:46px}#railDeck{max-height:calc(100dvh - 183px)}#railTabs button{height:32px}#bottom{bottom:9px}}

// Autosave is two-tier: disk only with previously granted permission; IndexedDB is recovery only.
const recoveryDB='mindmap-recovery-v1';
function recoveryStore(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(Error('IndexedDB unavailable'));return}const req=indexedDB.open(recoveryDB,1);req.onupgradeneeded=()=>req.result.createObjectStore('drafts');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
// Capture the document before async work. Serializing prevents old recovery writes from replacing newer ones.
function recoveryWrite(pending,snapshot=deep(doc),epoch=documentEpoch){

  if(epoch!==documentEpoch)return;
  try{
   const db=await recoveryStore();
   if(epoch!==documentEpoch){db.close();return}
   await new Promise((resolve,reject)=>{const tx=db.transaction('drafts','readwrite');tx.objectStore('drafts').put({doc:snapshot,pending,updated:Date.now()},'latest');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
   db.close();
  }catch(e){console.warn('Recovery unavailable',e)}
 };
 recoveryWrites=recoveryWrites.catch(()=>{}).then(write);return recoveryWrites;
}
async function recoveryRead(){
 await recoveryWrites.catch(()=>{});
 try{const db=await recoveryStore();const val=await new Promise((resolve,reject)=>{const tx=db.transaction('drafts','readonly');const request=tx.objectStore('drafts').get('latest');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});db.close();return val}catch(e){return null}
}
async function flushAutosave(){
 if(!dirty)return;
 const epoch=documentEpoch,revision=editRevision,content=serializeDoc(),handle=fileHandle;
 await recoveryWrite(true,deep(doc),epoch);
 if(epoch!==documentEpoch||!handle||fileConflict)return;
 try{
  const permission=typeof handle.queryPermission==='function'?await handle.queryPermission({mode:'readwrite'}):'granted';
  if(permission!=='granted'||epoch!==documentEpoch)return;
  const status=await writeFileQueued(handle,content,epoch,revision);
  if(status==='conflict')notice('File changed on disk · Save As to protect it');
 }catch(e){console.warn('Autosave to linked file unavailable',e)}
}
function queueAutosave(){clearTimeout(autosaveTimer);autosaveTimer=setTimeout(flushAutosave,1100)}

 catch(e){console.warn(e)}
}
